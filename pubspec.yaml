name: open_pdf_reader
description: "Open PDF Reader — a free, no-ads PDF reader and tools app. Read, merge, split, compress, convert and scan PDFs. Free forever."
# Free forever: no ads, no billing, no subscription, no tracking, works offline.
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # PDF viewing (Pdfium, open source)
  pdfx: ^2.9.0
  # PDF creation (image -> PDF)
  pdf: ^3.11.0
  # Pick files / images (Storage Access Framework, no broad permission needed)
  file_picker: ^10.0.0
  # Runtime permission requests (storage, camera)
  permission_handler: ^12.0.0
  # App documents directory (recents + created files)
  path_provider: ^2.1.0
  # Share created files with other apps
  share_plus: ^11.0.0
  # Camera / gallery for Scan to PDF
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test-only: fake PathProviderPlatform for widget tests (path_provider
  # on Android uses JNI, which never resolves in a test environment).
  path_provider_platform_interface: ^2.1.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Poppins for headings, Inter for body (both OFL licensed).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
