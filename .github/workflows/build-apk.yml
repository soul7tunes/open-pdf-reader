name: Build release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Release step creates a GitHub release, which needs write access to
# repository contents. Without this the default token is read-only here and
# the release step fails with 403 "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APKs (split per ABI, shrunk, obfuscated)
        run: >
          flutter build apk --release --split-per-abi --shrink --obfuscate
          --split-debug-info=build/debug-info
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-pdf-reader-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
      - name: Release APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-release-${{ github.run_number }}
          name: Open PDF Reader v1.2.0 build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-*-release.apk
